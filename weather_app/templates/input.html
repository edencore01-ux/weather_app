{% extends 'master.html' %}
{% load static %}

{% block title %}
weather_app
{% endblock %}

{% block content %}
    <div class="weather-container" id="weather-search-box">
    <h2 class="title">Weather Forecast</h2>
    
    <form action="{% url 'details' %}" method="GET" class="weather-form" id="weatherForm">
        
        <div class="input-group">
            <label for="country">Country:</label>
            <input type="text" 
                   name="country" 
                   id="country" 
                   class="form-input" 
                   placeholder="e.g. US or United States">
        </div>

        <div class="input-group">
            <label for="state">State/Province:</label>
            <input type="text" 
                   name="state" 
                   id="state" 
                   class="form-input" 
                   placeholder="e.g. New York">
        </div>

        <div class="input-group">
            <label for="city">City:</label>
            <input type="text" 
                   name="city" 
                   id="city" 
                   class="form-input" 
                   placeholder="e.g. Manhattan" 
                   required>
        </div>

        <button type="submit" class="btn-submit" id="getWeatherBtn">
            Check Weather
        </button>
        
    </form>
</div>
<style>
    /* Mobile Optimization for Input/Search Page */
@media screen and (max-width: 480px) {
    /* 1. Adjust the form container */
    .weather-form {
        width: 92% !important;
        padding: 25px 15px !important; /* Smaller side padding */
        margin: 20px auto;
    }

    /* 2. Fix the title size */
    .title {
        font-size: 1.8rem !important;
        margin-bottom: 20px !important;
    }

    /* 3. Make inputs and labels easier to tap */
    .input-group {
        margin-bottom: 15px;
    }

    .form-input {
        width: 100% !important; /* Ensures it never pokes out of the card */
        font-size: 1rem !important;
        padding: 12px !important;
        width: 100%;
        max-width: 100%;
        display: block;
        box-sizing: border-box
    }

    label {
        font-size: 0.9rem;
        margin-bottom: 5px;
        display: block;
    }

    /* 4. Full-width button for mobile */
    .btn-submit {
        width: 100% !important;
        padding: 15px !important;
        font-size: 1.1rem !important;
        margin-top: 10px;
    }
}
</style>
{% endblock %}
